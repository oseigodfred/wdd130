<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title> HTML & CSS Quiz</title>

    <link rel="stylesheet" href="styles/quiz-form.css">
</head>

</html>

<body>
    <h1>HTML and CSS Basics Quiz</h1>
    <form action="#" method="post">
        <div>
            <label for="Question 1">
                1. Which HTML tag is used to create a hyperlink?
            </label><br>
            <input type="text" id="Question 1" name="Question 1">
        </div>

        <br>

        <div>
            <label for="Question 2">
                2. Briefly explain the difference between HTML and CSS.
            </label><br>
            <textarea id="Question 2" name="Question 2" rows="4" cols="40"></textarea>
        </div>

        <br>

        <div>
            <label for="Question 3">
                3. Which CSS property is used to change text color?
            </label><br>
            <select id="Question 3" name="Question 3">
                <option value="" selected disabled>Choose One ...</option>
                <option value="color">color</option>
                <option value="font-size">font-size</option>
                <option value="background-color">background-color</option>
            </select>
        </div>

        <br>

        <div>
            <label for="Question 4">
                4. How many heading levels (h1-h6) are available in HTML?
            </label><br>
            <input type="number" id="Question 4" name="Question 4">
        </div>

        <br><br>

        <button type="submit">Submit Quiz</button>

    </form>
</body>
