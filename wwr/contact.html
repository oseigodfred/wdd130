<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us | Down the River</title>

    <meta name="description"
      content="Contact White Water Rafting Adventures for reservations, general inquiries, and trip information. Find our address, phone number, map, and contact form here.">
    <meta name="author" content="Godfred Osei">

    <link rel="stylesheet" href="styles/rafting.css" />
</head>

<body>

    <header class="site-header">
        <img class="logo" src="images/logo.png" alt="Down the River Logo" />
        <nav class="main-nav">
            <a href="index.html">Home</a>
            <a href="about.html" class="active">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html" class="active">Contact Us</a>
        </nav>
    </header>

    <main class="Contact-page">
        <h1>Contact Down the River Rafting</h1>

        <section class="company-info">
            <h2>Down The River</h2>
            <p>233 Nawuni Road</p>
            <p>Kumasi, Ghana</p>
            <p>+233 50 504 1123Phone</p>
            <p>info@downtheriver.com</p>
        </section>

        <div class="contact-grid">
            <section class="map-container">
                <iframe class="map-frame"
                  src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d832596.2376154073!2d-0.01471139231072905!3d6.649223901787707!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sgh!4v1770317351578!5m2!1sen!2sgh"
                  width="300" height="250" allowfullscreen="" loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade">
                </iframe>
            </section>

            <section class="contact-form">
                <form action="#" method="post">
                    <label for="full-name">Full Name</label>
                    <input type="text" id="full-name" name="full-name" required>

                    <label for="user-email">Email Address</label>
                    <input type="email" id="user-email" name="user-email" required>

                    <p>Purpose of Message</p>
                    <div class="radio-group">
                        <input type="radio" id="general" name="purpose" value="general" required>
                        <label for="general">General Inquiry</label>

                        <input type="radio" id="reservation" name="purpose" value="reservation">
                        <label for="reservation">Reservation Question</label>

                        <input type="radio" id="website" name="purpose" value="website">
                        <label for="website">Website Suggestion</label>
                    </div>

                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5"
                      placeholder="How can we help you?" required></textarea>

                    <div class="newsletter-row">
                        <input type="checkbox" id="subscribe" name="newsletter">
                        <label for="subscribe">Please subscribe me to the monthly newsletter</label>
                    </div>

                    <button type="submit" class="submit-btn">Send Your Message</button>
                </form>
            </section>

            <section class="employees">
                <h2>Meet Our Team</h2>
                <figure>
                    <img src="images/employee1.png" alt="Daniel Boateng">
                    <figcaption>Daniel Boateng</figcaption>
                </figure>
                <figure>
                    <img src="images/employee2.png" alt="Ama Mensah">
                    <figcaption>Ama Mensah</figcaption>
                </figure>
                <figure>
                    <img src="images/employee3.png" alt="Freda Asare">
                    <figcaption>Freda Asare</figcaption>
                </figure>
            </section>
    </main>

    <footer class="site-footer">
        <p>© 2026 🚣‍♂️ Down the River | Godfred Osei</p>
        <nav class="socialmedia">
            <a href="https://facebook.com"><img src="images/facebook.png" alt="Facebook"></a>
            <a href="https://twitter.com"><img src="images/twitter.png" alt="Twitter"></a>
            <a href="https://instagram.com"><img src="images/instagram.png" alt="Instagram"></a>
        </nav>
    </footer>

</body>

</html>
